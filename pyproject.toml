[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-web-scraper"
version = "2.0.0"
description = "High-performance resilient web scraping framework with hybrid HTTP/Playwright engine and anti-detection suite."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
]

[project.scripts]
advanced-web-scraper = "scraper.cli:app"
scraper = "scraper.cli:app"

[tool.setuptools.packages.find]
include = ["scraper*"]

